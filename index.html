<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-SCORE | Canlı Futbol Nəticələri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0e1118;
            color: #fff;
        }

        header {
            background-color: #161b26;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff2e93;
        }

        header h1 {
            color: #ff2e93;
            font-size: 1.8rem;
            letter-spacing: 1px;
        }

        header h1 span {
            color: #fff;
            background-color: #ff2e93;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 5px;
            font-size: 1.2rem;
        }

        .main-container {
            max-width: 1000px;
            margin: 25px auto;
            padding: 0 15px 50px 15px;
        }

        .widget-wrapper {
            background-color: #161b26;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #2c354a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            min-height: 600px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #637085;
            font-size: 0.85rem;
            border-top: 1px solid #161b26;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>X-SCORE<span>LIVE</span></h1>
    </header>

    <div class="main-container">
        <div class="widget-wrapper">
            <!-- Dünyadakı bütün canlı oyunları avtomatik çəkən rəsmi təhlükəsiz widget -->
            <iframe src="https://www.scoreaxis.com/widget/live-scores?autoHeight=1&bodyBackground=%23161b26&textColor=%23ffffff&font=Arial" 
                    style="width: 100%; height: 800px; border: none; overflow: hidden;" 
                    scrolling="yes" 
                    allowtransparency="true">
            </iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 X-SCORE. Bütün dünyadakı oyunlar tam doğru və anlıq olaraq yenilənir!</p>
    </footer>

</body>
</html>
