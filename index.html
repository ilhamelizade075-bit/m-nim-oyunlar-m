<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-SCORE | Canlı Futbol Nəticələri</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #fff;
        }

        header {
            background-color: #161b22;
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid #ff2e93;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        header h1 {
            color: #ff2e93;
            font-size: 2rem;
            letter-spacing: 1px;
        }

        header h1 span {
            color: #fff;
            background-color: #ff2e93;
            padding: 2px 8px;
            border-radius: 4px;
            margin-left: 6px;
            font-size: 1.3rem;
        }

        .main-container {
            max-width: 1100px;
            margin: 30px auto;
            padding: 0 15px;
        }

        .scores-card {
            background-color: #161b22;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #30363d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #8b949e;
            font-size: 0.85rem;
            border-top: 1px solid #21262d;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>X-SCORE<span>LIVE</span></h1>
    </header>

    <div class="main-container">
        <div class="scores-card">
            <!-- Tam stabil, kənar saytlara yönləndirməyən və canlı yenilənən rəsmi widget -->
            <iframe id="sofascore-embed"
                    src="https://www.sofascore.com/football/livescore/embed"
                    style="width: 100%; height: 850px; border: none; background-color: #161b22;"
                    scrolling="yes">
            </iframe>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 X-SCORE PORTAL. Bütün dünyadakı canlı qarşılaşmalar rəsmi qaynaqlarla anlıq yenilənir!</p>
    </footer>

</body>
</html>
