<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X-MODS Gaming Hub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e12;
            color: #fff;
            text-align: center;
            padding: 20px;
            overflow-x: hidden;
        }

        header {
            margin-bottom: 20px;
        }

        header h1 {
            color: #00ff88;
            font-size: 2.5rem;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.6);
            letter-spacing: 2px;
        }

        .game-description {
            color: #a0a5b5;
            max-width: 500px;
            margin: 10px auto 25px auto;
            font-size: 0.95rem;
            line-height: 1.5;
            background: #14161d;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #00ff88;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .scoreboard {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .score-x { color: #00d2ff; text-shadow: 0 0 15px rgba(0,210,255,0.5); }
        .score-o { color: #ff3838; text-shadow: 0 0 15px rgba(255,56,56,0.5); }

        #status-text {
            font-size: 1.2rem;
            margin-bottom: 15px;
            color: #ffb800;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        /* 3x3 Ölçülü Yeni Arena */
        .arena-grid {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            grid-template-rows: repeat(3, 100px);
            gap: 12px;
            justify-content: center;
            margin: 0 auto 25px auto;
            will-change: transform;
        }

        .arena-cell {
            background-color: #1a1c23;
            border: 2px solid #2d313f;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 2.5rem;
            color: transparent;
            transition: background-color 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        border-color 0.4s cubic-bezier(0.25, 1, 0.5, 1), 
                        box-shadow 0.4s cubic-bezier(0.25, 1, 0.5, 1),
                        transform 0.2s cubic-bezier(0.25, 1, 0.5, 1),
                        color 0.3s ease;
            will-change: background-color, transform, box-shadow;
        }

        .arena-cell:hover {
            background-color: #252833;
            transform: scale(1.06);
            z-index: 2;
        }

        .arena-cell.player-x {
            background-color: rgba(0, 210, 255, 0.25);
            border-color: #00d2ff;
            color: #00d2ff;
            box-shadow: 0 0 20px rgba(0, 210, 255, 0.6), inset 0 0 15px rgba(0, 210, 255, 0.4);
            animation: pulseBlue 0.4s ease-out;
        }

        .arena-cell.player-o {
            background-color: rgba(255, 56, 56, 0.25);
            border-color: #ff3838;
            color: #ff3838;
            box-shadow: 0 0 20px rgba(255, 56, 56, 0.6), inset 0 0 15px rgba(255, 56, 56, 0.4);
            animation: pulseRed 0.4s ease-out;
        }

        @keyframes pulseBlue {
            0% { transform: scale(0.8); background-color: rgba(0, 210, 255, 0.6); }
            100% { transform: scale(1); background-color: rgba(0, 210, 255, 0.25); }
        }

        @keyframes pulseRed {
            0% { transform: scale(0.8); background-color: rgba(255, 56, 56, 0.6); }
            100% { transform: scale(1); background-color: rgba(255, 56, 56, 0.25); }
        }

        .reset-btn {
            background: linear-gradient(135deg, #00ff88 0%, #00a354 100%);
            color: #0d0e12;
            border: none;
            padding: 14px 35px;
            font-size: 1.05rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(0, 255, 136, 0.3);
            transition: all 0.2s ease;
        }

        .reset-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 255, 136, 0.5);
        }
    </style>
</head>
<body>

    <header>
        <h1>KİBER ARENA: FƏTH</h1>
    </header>

    <div class="game-description">
        <strong>💡 Qaydalar:</strong> Boş xanalara klikləyərək ərazini fəth et və üzərində <strong>X-O</strong> yazılsın. Qonşu xanada rəqib varsa, onun ərazisini fəth edib öz hərfinə çevirəcəksən!
    </div>

    <div class="scoreboard">
        <div class="score-x">Mavi (X): <span id="scoreX">1</span></div>
        <div class="score-o">Qırmızı (O): <span id="scoreO">1</span></div>
    </div>

    <div id="status-text">Növbə: Mavi (X) Oyunçusunda</div>

    <div class="arena-grid" id="arenaGrid"></div>

    <button class="reset-btn" onclick="initGame()">Arenanı Yenilə</button>

    <script>
        const GRID_SIZE = 3;
        let board = [];
        let currentPlayer = 'X';
        let gameActive = true;

        function initGame() {
            const gridElement = document.getElementById("arenaGrid");
            gridElement.innerHTML = "";
            board = Array(GRID_SIZE).fill(null).map(() => Array(GRID_SIZE).fill(""));
            gameActive = true;
            currentPlayer = 'X';
            document.getElementById("status-text").innerText = "Növbə: Mavi (X) Oyunçusunda";
            document.getElementById("status-text").style.color = "#00d2ff";

            board[0][0] = 'X';
            board[GRID_SIZE-1][GRID_SIZE-1] = 'O';

            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cell = document.createElement("div");
                    cell.classList.add("arena-cell");
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    
                    if (r === 0 && c === 0) {
                        cell.classList.add("player-x");
                        cell.innerText = "X";
                    }
                    if (r === GRID_SIZE-1 && c === GRID_SIZE-1) {
                        cell.classList.add("player-o");
                        cell.innerText = "O";
                    }
                    
                    cell.addEventListener("click", () => handleCellClick(r, c, cell));
                    gridElement.appendChild(cell);
                }
            }
            updateScores();
        }

        function handleCellClick(r, c, cellElement) {
            if (board[r][c] !== "" || !gameActive) return;

            board[r][c] = currentPlayer;
            cellElement.innerText = currentPlayer;
            cellElement.classList.add(currentPlayer === 'X' ? 'player-x' : 'player-o');

            captureNeighbors(r, c);

            currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
            const status = document.getElementById("status-text");
            if (currentPlayer === 'X') {
                status.innerText = "Növbə: Mavi (X) Oyunçusunda";
                status.style.color = "#00d2ff";
            } else {
                status.innerText = "Növbə: Qırmızı (O) Oyunçusunda";
                status.style.color = "#ff3838";
            }

            updateScores();
            checkGameOver();
        }

        function captureNeighbors(r, c) {
            const directions = [[-1, 0], [1, 0], [0, -1], [0, 1]];

            directions.forEach(([dr, dc]) => {
                const nr = r + dr;
                const nc = c + dc;

                if (nr >= 0 && nr < GRID_SIZE && nc >= 0 && nc < GRID_SIZE) {
                    const target = board[nr][nc];
                    if (target !== "" && target !== currentPlayer) {
                        board[nr][nc] = currentPlayer;
                        setTimeout(() => {
                            const targetCell = document.querySelector(`[data-row='${nr}'][data-col='${nc}']`);
                            if(targetCell) {
                                targetCell.className = "arena-cell " + (currentPlayer === 'X' ? 'player-x' : 'player-o');
                                targetCell.innerText = currentPlayer;
                            }
                        }, 50);
                    }
                }
            });
        }

        function updateScores() {
            let countX = 0; let countO = 0;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === 'X') countX++;
                    if (board[r][c] === 'O') countO++;
                }
            }
            document.getElementById("scoreX").innerText = countX;
            document.getElementById("scoreO").innerText = countO;
        }

        function checkGameOver() {
            let hasEmpty = false;
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    if (board[r][c] === "") hasEmpty = true;
                }
            }

            if (!hasEmpty) {
                gameActive = false;
                const scoreX = parseInt(document.getElementById("scoreX").innerText);
                const scoreO = parseInt(document.getElementById("scoreO").innerText);
                const status = document.getElementById("status-text");
                
                if (scoreX > scoreO) {
                    status.innerText = "🎉 OYUN BİTDİ: MAVİ (X) APARDI!";
                    status.style.color = "#00d2ff";
                } else if (scoreO > scoreX) {
                    status.innerText = "🎉 OYUN BİTDİ: QIRMIZI (O) APARDI!";
                    status.style.color = "#ff3838";
                } else {
                    status.innerText = "🤝 BƏRABƏRƏ BİTDİ!";
                    status.style.color = "#ffb800";
                }
            }
        }

        initGame();
    </script>
</body>
</html>
