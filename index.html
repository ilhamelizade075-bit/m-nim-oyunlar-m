<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-select=none">
    <title>X-MODS Arcade: Neon Synth</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #050508;
            color: #fff;
            overflow: hidden;
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        .ui-layer {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            pointer-events: none;
            width: 90%;
            max-width: 500px;
        }

        h1 {
            font-size: 1.8rem;
            color: #00ffcc;
            text-shadow: 0 0 20px rgba(0, 255, 204, 0.8);
            letter-spacing: 3px;
            margin-bottom: 5px;
        }

        .stats-container {
            display: flex;
            justify-content: space-between;
            background: rgba(20, 20, 35, 0.6);
            padding: 10px 20px;
            border-radius: 50px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            backdrop-filter: blur(10px);
            box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        }

        .stat-box {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ff00ff;
            text-shadow: 0 0 10px rgba(255, 0, 255, 0.5);
        }

        #score { color: #00ffcc; text-shadow: 0 0 10px rgba(0, 255, 204, 0.5); }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #0c0f1d 0%, #050508 100%);
        }

        .modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(10, 11, 18, 0.85);
            border: 2px solid #ff00ff;
            box-shadow: 0 0 30px rgba(255, 0, 255, 0.4), inset 0 0 15px rgba(255, 0, 255, 0.2);
            padding: 30px 40px;
            border-radius: 16px;
            z-index: 20;
            backdrop-filter: blur(8px);
            width: 85%;
            max-width: 400px;
        }

        .modal h2 {
            font-size: 2rem;
            color: #ff00ff;
            text-shadow: 0 0 15px rgba(255, 0, 255, 0.6);
            margin-bottom: 15px;
        }

        .modal p {
            color: #a0a5b5;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .start-btn {
            background: linear-gradient(135deg, #00ffcc 0%, #0099ff 100%);
            color: #050508;
            border: none;
            padding: 14px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0, 255, 204, 0.4);
            transition: all 0.3s ease;
            width: 100%;
        }

        .start-btn:hover {
            transform: scale(1.03);
            box-shadow: 0 8px 25px rgba(0, 255, 204, 0.6);
        }

        .touch-hint {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            opacity: 0.3;
            pointer-events: none;
            z-index: 5;
        }
        .hint-side {
            border: 2px dashed #fff;
            padding: 15px 25px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
    </style>
</head>
<body>

    <div class="ui-layer">
        <center><h1>NEON SYNTH</h1></center>
        <div class="stats-container">
            <div class="stat-box">XAL: <span id="score">0</span></div>
            <div class="stat-box">REKORD: <span id="highscore">0</span></div>
        </div>
    </div>

    <div id="startModal" class="modal">
        <h2>KOSMİK SÜRƏT</h2>
        <p>Maneələrdən (Qırmızı) qaçaraq enerji kublarını (Sarı) topla! <br><br><strong>İdarəetmə:</strong><br>Kompüterdə: SAĞ / SOL ox düymələri<br>Telefonda: Ekranın sağına və ya soluna toxun.</p>
        <button class="start-btn" onclick="startGame()">ARENAYA GİR</button>
    </div>

    <div id="gameOverModal" class="modal" style="display: none;">
        <h2 style="color: #ff3838; text-shadow: 0 0 15px rgba(255,56,56,0.6);">SINDIN!</h2>
        <p id="gameOverReason">Kosmik gəminiz kiber maneəyə çırpıldı.</p>
        <button class="start-btn" onclick="startGame()">YENİDƏN BAŞLA</button>
    </div>

    <div class="touch-hint">
        <div class="hint-side">← Sola Keç</div>
        <div class="hint-side">Sağa Keç →</div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let player, obstacles, crystals, particles, score, gameActive, speedMultiplier;
        let highscore = localStorage.getItem("neon_highscore") || 0;
        document.getElementById("highscore").innerText = highscore;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let keys = { Left: false, Right: false };
        window.addEventListener("keydown", e => {
            if (e.key === "ArrowLeft") keys.Left = true;
            if (e.key === "ArrowRight") keys.Right = true;
        });
        window.addEventListener("keyup", e => {
            if (e.key === "ArrowLeft") keys.Left = false;
            if (e.key === "ArrowRight") keys.Right = false;
        });

        window.addEventListener("touchstart", e => {
            if (!gameActive) return;
            const touchX = e.touches[0].clientX;
            if (touchX < canvas.width / 2) {
                keys.Left = true;
            } else {
                keys.Right = true;
            }
        });
        window.addEventListener("touchend", () => {
            keys.Left = false;
            keys.Right = false;
        });

        class Player {
            constructor() {
                this.width = 40;
                this.height = 40;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 100;
                this.speed = 9;
            }
            update() {
                if (keys.Left && this.x > 0) this.x -= this.speed;
                if (keys.Right && this.x < canvas.width - this.width) this.x += this.speed;
            }
            draw() {
                ctx.save();
                ctx.shadowBlur = 20;
                ctx.shadowColor = "#00ffcc";
                ctx.fillStyle = "#00ffcc";
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.restore();
            }
        }

        class Obstacle {
            constructor() {
                this.width = Math.random() * 60 + 40;
                this.height = 20;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = (Math.random() * 3 + 4) * speedMultiplier;
            }
            update() { this.y += this.speed; }
            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ff3838";
                ctx.fillStyle = "#ff3838";
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.restore();
            }
        }

        class Crystal {
            constructor() {
                this.size = 18;
                this.x = Math.random() * (canvas.width - this.size);
                this.y = -this.size;
                this.speed = 5 * speedMultiplier;
            }
            update() { this.y += this.speed; }
            draw() {
                ctx.save();
                ctx.shadowBlur = 15;
                ctx.shadowColor = "#ffb800";
                ctx.fillStyle = "#ffb800";
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 4 + 1;
                this.speedX = Math.random() * 6 - 3;
                this.speedY = Math.random() * 6 - 3;
                this.color = color;
                this.alpha = 1;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.02;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function startGame() {
            document.getElementById("startModal").style.display = "none";
            document.getElementById("gameOverModal").style.display = "none";
            
            player = new Player();
            obstacles = [];
            crystals = [];
            particles = [];
            score = 0;
            speedMultiplier = 1;
            gameActive = true;
            
            document.getElementById("score").innerText = score;
            animate();
        }

        function endGame() {
            gameActive = false;
            if (score > highscore) {
                highscore = score;
                localStorage.setItem("neon_highscore", highscore);
                document.getElementById("highscore").innerText = highscore;
            }
            document.getElementById("gameOverModal").style.display = "block";
        }

        let obstacleTimer = 0;
        let crystalTimer = 0;

        function animate() {
            if (!gameActive) return;

            ctx.fillStyle = "rgba(5, 5, 8, 0.2)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            player.update();
            player.draw();

            speedMultiplier += 0.0002;

            obstacleTimer++;
            if (obstacleTimer > 25) {
                obstacles.push(new Obstacle());
                obstacleTimer = 0;
            }

            crystalTimer++;
            if (crystalTimer > 40) {
                crystals.push(new Crystal());
                crystalTimer = 0;
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) particles.splice(i, 1);
            }

            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].update();
                obstacles[i].draw();

                if (
                    player.x < obstacles[i].x + obstacles[i].width &&
                    player.x + player.width > obstacles[i].x &&
                    player.y < obstacles[i].y + obstacles[i].height &&
                    player.y + player.height > obstacles[i].y
                ) {
                    createExplosion(player.x + player.width/2, player.y + player.height/2, "#ff3838");
                    endGame();
                    return;
                }

                if (obstacles[i].y > canvas.height) obstacles.splice(i, 1);
            }

            for (let i = crystals.length - 1; i >= 0; i--) {
                crystals[i].update();
                crystals[i].draw();

                if (
                    player.x < crystals[i].x + crystals[i].size &&
                    player.x + player.width > crystals[i].x &&
                    player.y < crystals[i].y + crystals[i].size &&
                    player.y + player.height > crystals[i].y
                ) {
                    createExplosion(crystals[i].x + crystals[i].size/2, crystals[i].y + crystals[i].size/2, "#ffb800");
                    score += 10;
                    document.getElementById("score").innerText = score;
                    crystals.splice(i, 1);
                    continue;
                }

                if (crystals[i].y > canvas.height) crystals.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }
    </script>
</body>
</html>
